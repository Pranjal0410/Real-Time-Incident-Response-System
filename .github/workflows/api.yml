# Sends the saved ReqFlow requests at this API on every push.
#
# The point is the exit code. Someone changes a route, the login stops
# answering 200, and this goes red before anyone has to notice by hand.

name: API

on:
  push:
    branches: [main]
  pull_request:
  # so it can be run by hand from the Actions tab, without waiting for a push
  # to main — useful the first time, when what you want to know is whether the
  # workflow itself works
  workflow_dispatch:

jobs:
  requests:
    runs-on: ubuntu-latest

    # Its own database, thrown away when the job ends. Not the Atlas one in
    # .env: a test run that writes into the real database is a test run that
    # changes what it is testing, and it would leave its users behind.
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      PORT: 3001
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/incident-ci
      JWT_SECRET: not-a-secret-this-database-is-thrown-away
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # the collection asks for this one by name, because the file itself is
      # not allowed to carry it
      SEED_PASSWORD: ci-password-123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Start the API
        run: |
          node src/index.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid

      - name: Wait for it to answer
        run: |
          # a fixed sleep is either too short on a slow runner or wasted time on
          # a fast one, so this asks until it answers
          for i in $(seq 1 30); do
            if curl -fsS -m 2 http://localhost:3001/health > /dev/null; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the API never answered on 3001:"; cat /tmp/api.log; exit 1

      - name: Make the user the requests log in as
        run: |
          # Taken out of the collection rather than written again here. Whoever
          # changes which account the requests log in as should not also have to
          # remember to change this file, because the day they forget is the day
          # the build fails for a reason that has nothing to do with the code.
          email=$(node -e "
            const c = require('./reqflow.collection.json');
            const login = c.requests.find(r => /login/i.test(r.url));
            if (!login) { console.error('no login request in the collection'); process.exit(1); }
            process.stdout.write(JSON.parse(login.body).email);
          ")
          echo "logging in as $email"

          # The database is empty every run, so the account has to be created
          # before anything can log in as it. Already-exists is fine too: that
          # is what a re-run against a warm database looks like, and it is not
          # a reason to fail the build.
          code=$(curl -s -o /tmp/seed.json -w '%{http_code}' \
            -X POST http://localhost:3001/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI\",\"email\":\"$email\",\"password\":\"$SEED_PASSWORD\"}")
          if [ "$code" = "201" ] || [ "$code" = "200" ]; then
            echo "created"
          elif [ "$code" = "400" ] || [ "$code" = "409" ]; then
            echo "already there"
          else
            echo "could not create the user (HTTP $code):"; cat /tmp/seed.json; exit 1
          fi

      # The runner lives in the ReqFlow repository. The collection lives here,
      # beside the code it tests.
      - name: Get the ReqFlow runner
        uses: actions/checkout@v4
        with:
          repository: Pranjal0410/ReqFlow
          path: .reqflow

      - name: Install the runner
        working-directory: .reqflow/cli
        run: npm ci

      - name: Send the requests
        run: |
          node .reqflow/cli/bin/reqflow run reqflow.collection.json \
            --var password="$SEED_PASSWORD"

      - name: Show the API's output if anything failed
        if: failure()
        run: cat /tmp/api.log
