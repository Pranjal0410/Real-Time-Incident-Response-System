<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <!-- SEO -->
    <meta name="description" content="Real-time incident response platform for engineering teams. Coordinate incidents, track status, and resolve production issues faster with live collaboration." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#08090b" />

    <!--
      Fonts are self-hosted via @fontsource-variable/geist and imported from
      src/index.css, so there is no render-blocking round trip to a third-party
      CDN and no layout shift on first paint.
    -->

    <!-- Branded mark: signal pulse inside a squircle -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8eaed'/%3E%3Cpath d='M5 16.5h5.2l2.6-6.4 3.9 12.2 2.8-8 1.9 2.2H27' fill='none' stroke='%2308090b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="IncidentHub — Real-time Incident Response" />
    <meta property="og:description" content="Coordinate incidents in real-time with your engineering team" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IncidentHub" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>IncidentHub — Real-time Incident Response Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
